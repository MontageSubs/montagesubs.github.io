name: 文档改进
description: 改进或补充网站文档内容
title: "[documentation] "
labels:
  - documentation

body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！这将帮助提高文档质量。
        
        注意：
        - Wiki 和 Docs 部分的改进，请到 [MontageSubs/wiki](https://github.com/MontageSubs/wiki) 或 [MontageSubs/docs](https://github.com/MontageSubs/docs) 仓库提交
        - Blog 内容改进，请到 [MontageSubs/blog](https://github.com/MontageSubs/blog) 仓库提交
        - 社区工具的反馈请优先使用工具作者留下的渠道；无官方渠道时，请在此提供工具名称和具体意见

  - type: dropdown
    id: doc-section
    attributes:
      label: 文档所属区域
      description: 请选择这是关于哪个部分的改进。
      options:
        - 网站首页/概览
        - 关于我们
        - 项目页面
        - 工具页面
        - 学习页面
        - 社区页面
        - 贡献页面
        - 其他
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: 文档 URL
      description: 完整的页面地址。
      placeholder: "https://example.com/about"
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: 具体位置
      description: 页面中的具体位置。
      placeholder: "例如：『社群成员』章节"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 现存问题
      description: 文档哪里不清楚、不完整或有误？具体描述问题。
      placeholder: |
        例如：缺少示例代码、步骤不够详细、表述容易误解等
        
        可附带截图说明（如涉及界面交互）
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 改进建议
      description: 应该如何改进？提供具体的改进方案或示例。
      placeholder: "例如：补充说明、修正错误信息等"
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 参考资料（可选）
      description: 相关的链接、截图或其他参考信息。
      placeholder: "粘贴链接、截图或其他有用的上下文"
