name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["feature"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for your feature suggestion! Please describe your request clearly to help us understand and implement it faster.

  - type: textarea
    id: background
    attributes:
      label: Background and Use Case
      description: Why is this feature needed? What scenarios or user needs does it address?
      placeholder: "For example: Currently in...scenario...it becomes difficult, if we could..."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What specifically should be implemented? List key points and mention the modules involved.
      placeholder: |
        - Feature point 1
        - Feature point 2
        - Feature point 3 (module involved)
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Implementation Constraints (Optional)
      description: What limitations should be considered? For example, timeline requirements, technical constraints, compatibility needs.
      placeholder: |
        For example:
        - Timeline: Must be completed by [date]
        - Technical constraint: Cannot impact existing performance
        - Compatibility: Must support IE11+

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we verify this feature is complete? List verifiable standards.
      placeholder: |
        - [ ] Feature works correctly
        - [ ] Tested on browsers X, Y, Z
        - [ ] Performance metrics meet target X
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: References (Optional)
      description: Screenshots, design mockups, relevant links, or other supporting information.
      placeholder: "Paste screenshots, links, or other helpful context"

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this feature?
      options:
        - High
        - Medium
        - Low
    validations:

  - type: checkboxes
    id: checklist
    attributes:
      label: Before Submitting
      options:
        - label: I have searched for similar features and confirmed this is not a duplicate; my description is clear, complete, and easy to understand
          required: true
