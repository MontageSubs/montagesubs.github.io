name: 缺陷报告
description: 报告网站中的问题
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你报告这个问题！请填写以下信息帮助我们快速定位和解决。

  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 用一句话简洁描述问题，便于其他成员快速理解
      placeholder: "例如：点击功能按钮后页面显示404错误"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 详细描述
      description: 详细说明预期行为与实际行为的对比，如有必要请附上截图或录屏。
      placeholder: |
        **预期行为：** 点击按钮后，页面应该正常加载并显示功能列表

        **实际行为：** 页面显示404错误，无法加载任何内容

        **截图/视频：** [粘贴或上传]
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 重现步骤
      description: 如何才能看到这个问题？请列举具体操作步骤。
      placeholder: |
        1. 打开首页
        2. 点击"功能"按钮
        3. 看到404错误
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 提供你的系统和浏览器信息，以及任何其他相关的上下文
      placeholder: |
        - 浏览器：Chrome 120.0
        - 操作系统：Windows 11
        - 屏幕尺寸：1920x1080
        - 其他信息：使用代理、特殊网络环境等
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      description: 这个问题的影响程度如何？（可选，由开发者负责分配）
      options:
        - None（待分配）
        - Critical（严重 - 功能完全不可用）
        - High（高 - 主要功能受影响）
        - Medium（中 - 部分功能受影响）
        - Low（低 - 轻微影响或视觉问题）

  - type: textarea
    id: additional
    attributes:
      label: 补充说明（可选）
      description: 有其他信息想补充吗？例如错误日志、临时解决方案、相关讨论等
      placeholder: "例如：在控制台看到的错误信息、临时规避方案等"

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已确认问题报告清晰完整，包含重现步骤、环境信息和预期vs实际行为的对比；我已搜索确认不存在重复报告。
          required: true
